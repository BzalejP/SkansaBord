:root{
  --page:#C7D1D4; --floor:#F7F8F5; --ink:#24313C; --ink-soft:#5B6873; --line:#9AA7AF;
  --block:#2C3944; --block-text:#E9EEF0;

  --chair:#FFFFFF; --sec:rgba(36,49,60,.05); --sec-hover:rgba(36,49,60,.10); --sec-line:#7E8C95;

}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --page:#121A20; --floor:#1C262E; --ink:#E4EAED; --ink-soft:#9AA8B1; --line:#4C5A64;
  --block:#34424D; --block-text:#B4C0C7;

  --page:#121A20; --floor:#1C262E; --ink:#E4EAED; --ink-soft:#9AA8B1; --line:#4C5A64;
  --block:#34424D; --block-text:#B4C0C7;

  --bar-bg:rgba(28,38,46,.94); --chip:#24303A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--page);color:var(--ink);
  font-family:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;

.app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bar-bg);border-bottom:1px solid var(--line)}
.title{flex:1;min-width:0}
.title h1{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title p{margin:2px 0 0;font-size:.9rem;color:var(--ink-soft)}
.tally{display:flex;gap:14px;font-size:.95rem;font-weight:600}
.tally span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.dot.f{background:var(--free)} .dot.b{background:var(--busy)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:7px 12px;font-weight:600;font-size:.95rem;min-height:38px}
.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--free);outline-offset:2px}
#back[hidden]{display:none}
.stage{flex:1;min-height:0;position:relative;touch-action:manipulation}
svg{width:100%;height:100%;display:block}
.floor{fill:var(--floor);stroke:var(--ink);stroke-width:3}
.block{fill:var(--block)}
.blocklabel{fill:var(--block-text);font-size:11px;font-weight:600;letter-spacing:.12em;text-anchor:middle}
.counter{fill:none;stroke:var(--line);stroke-width:26;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.sec{fill:var(--sec);stroke:var(--sec-line);stroke-width:1.2;stroke-dasharray:5 4;cursor:pointer;transition:fill .2s}
.sec:hover{fill:var(--sec-hover)}
.zoomed .sec{fill:transparent;stroke:transparent}
.zoomed .sec.active{stroke:var(--sec-line)}
.seclabel{fill:var(--ink-soft);font-size:15px;font-weight:700;text-anchor:middle;pointer-events:none;transition:opacity .25s}
.zoomed .seclabel{opacity:0}
.t{pointer-events:none}
.zoomed .t.on{pointer-events:auto;cursor:pointer}
.t .chair{fill:var(--chair);stroke:var(--ink-soft);stroke-width:1}
.t .top{fill:var(--free-bg);stroke:var(--free);stroke-width:1.6;transition:fill .15s,stroke .15s}
.t .num{fill:var(--ink);font-size:9px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.t.busy .top{fill:var(--busy-bg);stroke:var(--busy)}
.t.busy .num{fill:#fff}
.t .hit{fill:transparent}
.zoomed .t.dim{opacity:.35}
.t.pop .top{animation:pop .22s ease-out}
@keyframes pop{50%{transform:scale(1.18)}}
.t .top{transform-box:fill-box;transform-origin:center}
footer{display:flex;gap:8px;padding:8px 10px;overflow-x:auto;background:var(--bar-bg);border-top:1px solid var(--line);scrollbar-width:none}
.chip{flex:1 0 auto;min-width:96px;border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:6px 10px;text-align:left;line-height:1.15}
.chip b{display:block;font-size:1rem}
.chip small{font-size:.85rem;color:var(--ink-soft)}
.chip .meter{display:block;height:4px;border-radius:2px;background:var(--free-bg);margin-top:5px;overflow:hidden}
.chip .meter i{display:block;height:100%;background:var(--busy);width:0;transition:width .25s}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
@media (max-width:520px){ .tally{display:none} header{padding:8px 10px} }
@media (prefers-reduced-motion:reduce){ .t.pop .top{animation:none} *{transition:none!important} }

    const w=t.w,h=t.h, hw=w/2, hh=h/2;
    el('rect',{class:'hit',x:-hw-(t.l?10:3),y:-hh-(t.t?10:3),width:w+(t.l?10:3)+(t.r?10:3),height:h+(t.t?10:3)+(t.b?10:3)},g);
    if(t.t) chairsLine(g,0,-hh-5,t.t,w,true);
    if(t.b) chairsLine(g,0,hh+5,t.b,w,true);
    if(t.l) chairsLine(g,-hw-5,0,t.l,h,false);
    if(t.r) chairsLine(g,hw+5,0,t.r,h,false);
    el('rect',{class:'top',x:-hw,y:-hh,width:w,height:h,rx:2},g);
  }
  const tx = el('text',{class:'num',x:0,y:0.5},g); tx.textContent=t.n;
  if(t.rot) tx.setAttribute('transform',`rotate(${t.rot})`);
  if(t.n>=100) tx.style.fontSize='8px';
  g.addEventListener('click',e=>{ e.stopPropagation(); tap(t); });
});

/* --- tapping: single = occupied, double = available --- */
let last={n:0,time:0};
function tap(t){
  const now=performance.now();
  if(last.n===t.n && now-last.time<350){ busy.delete(t.n); last={n:0,time:0}; }
  else { busy.add(t.n); last={n:t.n,time:now}; }
  t.g.classList.remove('pop'); void t.g.getBBox(); t.g.classList.add('pop');
  save(); render();
}

/* --- zoom --- */
let active=null, vb=FULL.slice(), anim=null;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function setVB(v){ vb=v; svg.setAttribute('viewBox',v.map(n=>n.toFixed(2)).join(' ')); }
function animateTo(target){
  cancelAnimationFrame(anim);
  if(reduce){ setVB(target); return; }
  const from=vb.slice(), t0=performance.now(), dur=520;
  const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
  (function step(now){ const p=Math.min(1,(now-t0)/dur), e=ease(p);
    setVB(from.map((f,i)=>f+(target[i]-f)*e)); if(p<1) anim=requestAnimationFrame(step); })(t0);
}
function zoomTo(id){
  active=id; const s=SECTIONS[id-1], pad=18;
  animateTo([s.box[0]-pad,s.box[1]-pad,s.box[2]-s.box[0]+pad*2,s.box[3]-s.box[1]+pad*2]);
  render();
}
function zoomOut(){ active=null; animateTo(FULL); render(); }
svg.addEventListener('click',e=>{ if(!active) return; const c=e.target.classList; if(e.target===svg || c.contains('floor') || c.contains('block')) zoomOut(); });
document.getElementById('back').onclick=zoomOut;
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && active) zoomOut(); });
document.getElementById('clear').onclick=()=>{
  const list = active ? TABLES.filter(t=>t.sec===active) : TABLES;
  const n = list.filter(t=>busy.has(t.n)).length;
  if(!n) return;
  if(!confirm(`Mark ${n} occupied table${n>1?'s':''} ${active?'in section '+active:''} as available?`.replace('  ',' '))) return;
  list.forEach(t=>busy.delete(t.n)); save(); render();
};

/* --- chips --- */
const chips=document.getElementById('chips');
SECTIONS.forEach(s=>{
  const b=document.createElement('button'); b.className='chip';
  b.innerHTML=`<b>Section ${s.id}</b><small></small><span class="meter"><i></i></span>`;
  b.onclick=()=> active===s.id ? zoomOut() : zoomTo(s.id);
  chips.appendChild(b); s.chip=b;
});

function render(){
  svg.classList.toggle('zoomed',!!active);
  TABLES.forEach(t=>{
    t.g.classList.toggle('busy',busy.has(t.n));
    t.g.classList.toggle('on',t.sec===active);
    t.g.classList.toggle('dim',!!active && t.sec!==active);
  });
  SECTIONS.forEach(s=>{
    const ts=TABLES.filter(t=>t.sec===s.id), b=ts.filter(t=>busy.has(t.n)).length;
    s.chip.querySelector('small').textContent=`${ts.length-b} of ${ts.length} free`;
    s.chip.querySelector('i').style.width=(b/ts.length*100)+'%';
    s.chip.setAttribute('aria-pressed',active===s.id);
    s.el.classList.toggle('active',active===s.id);
  });
  const nb=busy.size;
  document.getElementById('nb').textContent=nb;
  document.getElementById('nf').textContent=TABLES.length-nb;
  document.getElementById('back').hidden=!active;
  document.getElementById('clear').textContent=active?'Free section':'Free all';
  document.getElementById('h1').textContent=active?`Section ${active}`:'Skansagarður floor';
  document.getElementById('hint').textContent=active?'Tap: occupied. Double-tap: available.':'Tap a section to zoom in';
}
render();
</script>
</body>
